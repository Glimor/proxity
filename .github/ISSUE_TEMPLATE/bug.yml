name: Bug report
description: Report a reproducible problem (fix request).
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: "Do not post credentials, proxy exports, private endpoints, or personal paths. Report vulnerabilities through the Security tab."
  - type: input
    id: version
    attributes:
      label: Proxity version
      description: Find it in Settings; include a commit if building from source.
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and build
      placeholder: Windows 11 x64, build number from winver
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include relevant proxy protocol and routing settings without secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, usernames, personal paths and private endpoints first.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed sensitive information.
          required: true
