name: Question or information
description: Ask a focused technical question or request clarification.
title: "[Question]: "
labels: [question, needs-triage]
body:
  - type: markdown
    attributes:
      value: "For general help, prefer Discussions. Never include passwords or real proxy connection details."
  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Proxity and Windows versions
  - type: textarea
    id: tried
    attributes:
      label: Documentation read and steps tried
    validations:
      required: true
