name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CGO_ENABLED: "0"

jobs:
  go:
    name: go vet / fmt / test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt check
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "not gofmt-clean:"; echo "$files"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  frontend:
    name: frontend build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci + build
        working-directory: frontend
        run: |
          npm ci
          npm run build

  build:
    name: wails build
    runs-on: windows-latest
    needs: [go, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: build binaries
        shell: pwsh
        run: ./build.ps1 -Version "0.0.0-ci.$env:GITHUB_RUN_NUMBER" -NoInstaller

      - name: upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: proxity-binaries
          path: build/bin/
          retention-days: 7

  vulncheck:
    name: govulncheck
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: stable
          go-package: ./...
