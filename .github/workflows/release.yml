name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CGO_ENABLED: "0"

jobs:
  release:
    name: build + publish installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: install wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: install NSIS
        run: choco install nsis -y --no-progress

      - name: resolve version from tag
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: build binaries + NSIS installer
        shell: pwsh
        run: ./scripts/build.ps1 -Version "${{ steps.ver.outputs.version }}"

      - name: checksums
        shell: pwsh
        run: |
          Push-Location build/bin
          Get-ChildItem -File -Filter *.exe |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: publish github release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/bin/*-installer.exe
            build/bin/proxity-service.exe
            build/bin/checksums.txt
