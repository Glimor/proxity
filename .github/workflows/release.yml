name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without v, for example 0.2.0 or 0.2.0-rc.1'
        required: true
        type: string
        default: '0.2.0'
permissions:
  contents: read
  actions: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
env:
  CGO_ENABLED: '0'
jobs:
  release:
    name: Build and publish installer
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify version, main commit and successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            $env:INPUT_VERSION.Trim()
          } else {
            $env:GITHUB_REF_NAME -replace '^v', ''
          }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.(0|[1-9][0-9]*))?$') {
            throw 'Use X.Y.Z or X.Y.Z-rc.N without a v prefix, for example 0.2.0.'
          }
          $windowsVersion = ($version -split '-', 2)[0]
          foreach ($part in $windowsVersion.Split('.')) {
            if ([long]$part -gt 65535) { throw 'Windows version components must be at most 65535.' }
          }
          $tag = "v$version"
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the checked-out commit.' }
          $existingTag = git tag --list $tag
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect release tags.' }
          if ($existingTag) {
            $tagCommit = git rev-parse "$tag^{commit}"
            if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $sha) { throw 'Release tag already points to another commit.' }
          }
          $main = gh api "repos/$env:GITHUB_REPOSITORY/commits/main" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $sha -ne $main) { throw 'Release tag must point to the current main commit' }
          foreach ($workflow in @('ci.yml', 'codeql.yml')) {
            $json = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$sha&event=push&per_page=10"
            if ($LASTEXITCODE -ne 0) { throw "Cannot read $workflow checks" }
            $runs = @((($json -join "`n") | ConvertFrom-Json).workflow_runs)
            if ($runs.Count -eq 0 -or $runs[0].conclusion -ne 'success') { throw "$workflow must pass on this main commit before tagging" }
          }
          "version=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $windowsVersion
          $config | ConvertTo-Json -Depth 20 | Set-Content wails.json -Encoding utf8
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build installer and components
        run: ./scripts/build.ps1 -Version $env:version
      - name: Package distribution and checksums
        shell: pwsh
        run: |
          $files = @('build/bin/proxity.exe', 'build/bin/proxity-service.exe', 'build/bin/WinDivert.dll', 'build/bin/WinDivert64.sys', 'build/bin/licenses')
          Compress-Archive -Path $files -DestinationPath "build/bin/Proxity-$env:version-windows-amd64.zip"
          Get-ChildItem build/bin -File | Where-Object Extension -In '.exe', '.dll', '.sys', '.zip' |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii build/bin/checksums.txt
      - name: Upload draft release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: docs/release-notes.md
          files: |
            build/bin/*-installer.exe
            build/bin/Proxity-*-windows-amd64.zip
            build/bin/checksums.txt
      - name: Publish completed release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $argsList = @('release', 'edit', $env:RELEASE_TAG, '--repo', $env:GITHUB_REPOSITORY, '--draft=false')
          if ($env:RELEASE_TAG.Contains('-')) { $argsList += '--prerelease' }
          gh @argsList
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed; inspect the draft assets' }
